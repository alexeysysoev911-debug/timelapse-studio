name: Release

# Выпуск версии:
#   1) поднять "version" в src-tauri/tauri.conf.json, ui/package.json и Cargo.toml (workspace);
#   2) Actions → Release → Run workflow (или git tag v3.0.1 && git push --tags).
# Публикует установщик + latest.json — по нему программы у пользователей обновляются сами.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      # подпись кода (убирает «Windows защитил ваш компьютер») — когда заданы секреты Azure Trusted Signing
      HAS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Ключ обновлений задан?
        if: env.HAS_UPDATER_KEY != 'true'
        shell: pwsh
        run: |
          Write-Error "Нет секрета TAURI_SIGNING_PRIVATE_KEY: без него автообновление не заработает. Settings → Secrets and variables → Actions."
          exit 1
      - name: ffmpeg
        shell: pwsh
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: ./scripts/fetch-ffmpeg.ps1
      - run: npm ci
        working-directory: ui
      - name: Тесты ядра
        shell: pwsh
        run: |
          $env:PATH = "$PWD\src-tauri\resources\ffmpeg;$env:PATH"
          cargo test -p tls-core --release -- --test-threads=2
      - name: Подпись кода — подготовка
        if: env.HAS_SIGNING == 'true'
        run: cargo install trusted-signing-cli --locked
      - name: Сборка установщика и файлов обновления
        working-directory: src-tauri
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $cfg = @{ bundle = @{ createUpdaterArtifacts = $true } }
          if ($env:HAS_SIGNING -eq 'true') {
            $cfg.bundle.windows = @{ signCommand = "trusted-signing-cli -e ${{ secrets.AZURE_SIGNING_ENDPOINT }} -a ${{ secrets.AZURE_SIGNING_ACCOUNT }} -c ${{ secrets.AZURE_CERT_PROFILE }} -d TimelapseStudio %1" }
          }
          $cfg | ConvertTo-Json -Depth 5 -Compress | Set-Content -Path release.json -Encoding utf8
          node ../ui/node_modules/@tauri-apps/cli/tauri.js build --config release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: latest.json
        id: meta
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$ver"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            Write-Error "Тег $env:GITHUB_REF_NAME не совпадает с версией $ver в tauri.conf.json"; exit 1
          }
          $exe = Get-ChildItem "target/release/bundle/nsis/*_${ver}_x64-setup.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "Установщик не найден"; exit 1 }
          $sigFile = "$($exe.FullName).sig"
          if (-not (Test-Path $sigFile)) { Write-Error "Нет подписи обновления $sigFile"; exit 1 }
          New-Item -ItemType Directory -Force out | Out-Null
          # имя без пробелов: GitHub заменяет пробелы в именах файлов, и ссылка бы не совпала
          $name = "TimelapseStudio_${ver}_x64-setup.exe"
          Copy-Item $exe.FullName "out/$name"
          $sig = (Get-Content $sigFile -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$name"
          $platform = @{ signature = $sig; url = $url }
          $json = [ordered]@{
            version   = $ver
            notes     = "Timelapse Studio $ver"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{ "windows-x86_64" = $platform; "windows-x86_64-nsis" = $platform }
          }
          $json | ConvertTo-Json -Depth 5 | Set-Content -Path out/latest.json -Encoding utf8NoBOM
          Get-Content out/latest.json
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Timelapse Studio ${{ steps.meta.outputs.tag }}
          draft: false
          make_latest: true
          generate_release_notes: true
          files: |
            out/TimelapseStudio_*_x64-setup.exe
            out/latest.json
