name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Ядро · тесты (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev
      - run: mkdir -p ui/dist && echo '<!doctype html>' > ui/dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p tls-core -- --test-threads=2

  ui:
    name: Интерфейс · тесты и сборка
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows:
    name: Windows · тесты и установщик
    runs-on: windows-latest
    needs: [core-linux, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: ffmpeg
        shell: pwsh
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: ./scripts/fetch-ffmpeg.ps1
      - name: Тесты ядра на Windows (кириллица, пути, скрытые окна)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\src-tauri\resources\ffmpeg;$env:PATH"
          cargo test -p tls-core -- --test-threads=2
      - run: npm ci
        working-directory: ui
      - name: Сборка установщика
        working-directory: src-tauri
        run: node ../ui/node_modules/@tauri-apps/cli/tauri.js build
      - uses: actions/upload-artifact@v4
        with:
          name: TimelapseStudio-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
